version: '3.8'

services:
  glances:
    image: nicolargo/glances:latest-full
    container_name: glances
    restart: unless-stopped
    pid: host
    privileged: true
    networks:
      - glances-network
    ports:
      - "61208:61208"
    environment:
      - GLANCES_OPT=-w
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /run/user/1000/podman/podman.sock:/run/user/1000/podman/podman.sock:ro
    command: python3 -m glances -C /glances/conf/glances.conf $GLANCES_OPT

  glances-ui:
    image: ghcr.io/blishtan/glancesui:latest
    container_name: glances-ui
    networks:
      - glances-network
    ports:
      - "3000:80"
    environment:
      - GLANCES_HOST=glances
      - GLANCES_PORT=61208
    depends_on:
      - glances
    restart: unless-stopped

networks:
  glances-network:
    driver: bridge
