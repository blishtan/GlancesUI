version: '3.8'

services:
  glances-ui:
    image: ghcr.io/${GITHUB_USERNAME}/glancesui:latest
    container_name: glances-ui
    ports:
      - "${UI_PORT:-3000}:80"
    environment:
      - GLANCES_HOST=${GLANCES_HOST:-localhost}
      - GLANCES_PORT=${GLANCES_PORT:-61208}
    restart: unless-stopped
